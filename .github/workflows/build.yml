name: Build static FFmpeg

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  x264:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x264
        run: python ffmpeg-build/libs/build_x264.py

      - name: Package x264 install
        run: |
          mkdir -p x264-install/include
          mkdir -p x264-install/lib/pkgconfig

          cp /usr/local/include/x264.h x264-install/include/
          cp /usr/local/lib/libx264.a x264-install/lib/
          cp /usr/local/lib/pkgconfig/x264.pc x264-install/lib/pkgconfig/
      - uses: actions/upload-artifact@v4
        with:
          name: x264-install
          path: x264-install/

  x265:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x265
        run: python ffmpeg-build/libs/build_x265.py

      - name: Package x265 install
        run: |
          mkdir -p x265-install/include
          mkdir -p x265-install/lib
          mkdir -p x265-install/lib/pkgconfig

          cp /usr/local/include/x265.h x265-install/include/
          cp /usr/local/include/x265_config.h x265-install/include/ || true
          cp /usr/local/lib/libx265.a x265-install/lib/
          cp /usr/local/lib/pkgconfig/x265.pc x265-install/lib/pkgconfig/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: x265-install
          path: x265-install/

  libaom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libaom
        run: python ffmpeg-build/libs/build_libaom.py

      - name: Package libaom install
        run: |
          mkdir -p libaom-install/include/aom
          mkdir -p libaom-install/lib/pkgconfig

          cp /usr/local/include/aom/* libaom-install/include/aom/
          cp /usr/local/lib/libaom.a libaom-install/lib/
          cp /usr/local/lib/pkgconfig/aom.pc libaom-install/lib/pkgconfig/
      - uses: actions/upload-artifact@v4
        with:
          name: libaom-install
          path: libaom-install/

  libvpx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libvpx
        run: python ffmpeg-build/libs/build_libvpx.py

      - name: Package libvpx install
        run: |
          mkdir -p libvpx-install/include/vpx
          mkdir -p libvpx-install/lib/pkgconfig

          cp /usr/local/include/vpx/* libvpx-install/include/vpx/
          cp /usr/local/lib/libvpx.a libvpx-install/lib/
          cp /usr/local/lib/pkgconfig/vpx.pc libvpx-install/lib/pkgconfig/
      - uses: actions/upload-artifact@v4
        with:
          name: libvpx-install
          path: libvpx-install/

  svtav1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SVT-AV1
        run: python ffmpeg-build/libs/build_svtav1.py

      - name: Package SVT-AV1 install
        run: |
          mkdir -p svtav1-install/include/svt-av1
          mkdir -p svtav1-install/lib/pkgconfig

          cp /usr/local/include/svt-av1/* svtav1-install/include/svt-av1/
          cp /usr/local/lib/libSvtAv1Enc.a svtav1-install/lib/
          cp /usr/local/lib/pkgconfig/SvtAv1Enc.pc svtav1-install/lib/pkgconfig/
      - uses: actions/upload-artifact@v4
        with:
          name: svtav1-install
          path: svtav1-install/

  nvcodec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NVENC headers
        run: python ffmpeg-build/libs/build_nvcodec.py

      - name: Package NVENC install
        run: |
          mkdir -p nvcodec-install/include/ffnvcodec
          cp -r /usr/local/include/ffnvcodec/* nvcodec-install/include/ffnvcodec/
      - uses: actions/upload-artifact@v4
        with:
          name: nvcodec-install
          path: nvcodec-install/

  ffmpeg:
    runs-on: ubuntu-latest
    needs: [x264, x265, libaom, libvpx, svtav1, nvcodec]

    steps:
      - name: Ensure pkg-config path
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      # --- CACHE FFMPEG SOURCE ---
      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-src-${{ runner.os }}-v1

      # --- DOWNLOAD ARTIFACTS ---
      - uses: actions/download-artifact@v4
        with:
          name: x264-install
          path: /tmp/x264

      - uses: actions/download-artifact@v4
        with:
          name: x265-install
          path: /tmp/x265

      - uses: actions/download-artifact@v4
        with:
          name: libaom-install
          path: /tmp/libaom

      - uses: actions/download-artifact@v4
        with:
          name: libvpx-install
          path: /tmp/libvpx

      - uses: actions/download-artifact@v4
        with:
          name: svtav1-install
          path: /tmp/svtav1

      - uses: actions/download-artifact@v4
        with:
          name: nvcodec-install
          path: /tmp/nvcodec

      # --- SYSTEM DEPS ---
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libc6-dev \
            libpthread-stubs0-dev \
            zlib1g-dev \
            libdrm-dev \
            pkg-config \
            nasm \
            yasm

      # --- INSTALL LIBS ---
      - name: Install libs
        run: |
          sudo mkdir -p /usr/local/include /usr/local/lib /usr/local/lib/pkgconfig

          sudo cp -r /tmp/x264/include/* /usr/local/include/
          sudo cp -r /tmp/x264/lib/*.a /usr/local/lib/
          sudo cp -r /tmp/x264/lib/pkgconfig/* /usr/local/lib/pkgconfig/

          sudo cp -r /tmp/x265/include/* /usr/local/include/
          sudo cp -r /tmp/x265/lib/*.a /usr/local/lib/
          sudo cp -r /tmp/x265/lib/pkgconfig/* /usr/local/lib/pkgconfig/ || true

          sudo cp -r /tmp/libaom/include/* /usr/local/include/
          sudo cp -r /tmp/libaom/lib/*.a /usr/local/lib/
          sudo cp -r /tmp/libaom/lib/pkgconfig/* /usr/local/lib/pkgconfig/

          sudo cp -r /tmp/libvpx/include/* /usr/local/include/
          sudo cp -r /tmp/libvpx/lib/*.a /usr/local/lib/
          sudo cp -r /tmp/libvpx/lib/pkgconfig/* /usr/local/lib/pkgconfig/

          sudo cp -r /tmp/svtav1/include/* /usr/local/include/
          sudo cp -r /tmp/svtav1/lib/*.a /usr/local/lib/
          sudo cp -r /tmp/svtav1/lib/pkgconfig/* /usr/local/lib/pkgconfig/

          sudo cp -r /tmp/nvcodec/include/* /usr/local/include/

      - name: Fix pkg-config files (STRICT)
        run: |
          python ffmpeg-build/fix_pkgconfig.py

          # verify x265
          pkg-config --exists x265 || (echo "x265 pkg-config STILL MISSING" && exit 1)

          pkg-config --static --libs x265

      # --- DEBUG ---
      - name: Debug lib paths
        run: |
          ls -R /usr/local/lib/pkgconfig || true
          ls -R /usr/local/lib64/pkgconfig || true
      - name: Debug pkg-config
        run: |
          echo "==== PACKAGES ===="
          pkg-config --list-all | grep -E "x264|x265|aom|vpx|Svt" || true

          echo "==== STATIC LIBS ===="
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --static --libs x264 || true
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --static --libs x265 || true

      - name: Validate deps (STRICT)
        run: |
          pkg-config --exists x264 || exit 1
          pkg-config --exists x265 || exit 1
          pkg-config --exists aom || exit 1
          pkg-config --exists vpx || exit 1
          pkg-config --exists SvtAv1Enc || exit 1

          pkg-config --static --libs x264
          pkg-config --static --libs x265

      # --- BUILD ---
      - name: Build FFmpeg
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig
          CFLAGS: -I/usr/local/include
          LDFLAGS: -L/usr/local/lib
        run: |
          python ffmpeg-build/generate_flags.py
          python ffmpeg-build/build_ffmpeg.py

      # --- SAVE CONFIG LOG ---
      - name: Upload config.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log
          path: ffmpeg/ffbuild/config.log

      # --- SAVE BUILD LOG ---
      - name: Upload build dir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-dir
          path: ffmpeg/

      # --- FINAL BINARIES ---
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static
          path: ffmpeg-build/dist/
