name: Build static FFmpeg

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PREFIX: /usr/local
      DEPS_PREFIX: /usr/local

    steps:
      - uses: actions/checkout@v4

      # ─────────────────────────────────────
      # SYSTEM DEPS
      # ─────────────────────────────────────
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake ninja-build \
            pkg-config nasm yasm curl \
            libdrm-dev zlib1g-dev

      # ─────────────────────────────────────
      # BUILD LIBS (ALL IN SAME JOB)
      # ─────────────────────────────────────
      - name: Build x264
        run: python ffmpeg-build/libs/build_x264.py

      - name: Build x265
        run: python ffmpeg-build/libs/build_x265.py

      - name: Build libaom
        run: python ffmpeg-build/libs/build_libaom.py

      - name: Build libvpx
        run: python ffmpeg-build/libs/build_libvpx.py

      - name: Build SVT-AV1
        run: python ffmpeg-build/libs/build_svtav1.py

      - name: Build NVENC headers
        run: python ffmpeg-build/libs/build_nvcodec.py

      # ─────────────────────────────────────
      # VERIFY INSTALLS
      # ─────────────────────────────────────
      - name: Debug installed libs
        run: |
          ls -R /usr/local/include || true
          ls -R /usr/local/lib || true
          ls -R /usr/local/lib/pkgconfig || true

      # ─────────────────────────────────────
      # PKG-CONFIG SAFETY
      # ─────────────────────────────────────
      - name: Validate pkg-config
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
          pkg-config --list-all | grep -E "x264|x265|aom|vpx|Svt" || true

      # ─────────────────────────────────────
      # CACHE FFMPEG SOURCE
      # ─────────────────────────────────────
      - name: Cache FFmpeg source
        uses: actions/cache@v4
        with:
          path: ffmpeg
          key: ffmpeg-src-v1

      # ─────────────────────────────────────
      # BUILD FFMPEG
      # ─────────────────────────────────────
      - name: Build FFmpeg
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig
          CFLAGS: -I/usr/local/include
          LDFLAGS: -L/usr/local/lib
        run: |
          python ffmpeg-build/generate_flags.py
          python ffmpeg-build/build_ffmpeg.py

      # ─────────────────────────────────────
      # PACKAGE OUTPUT
      # ─────────────────────────────────────
      - name: Create artifact bundle
        run: |
          mkdir -p ffmpeg-artifact

          cp -r /usr/local/include ffmpeg-artifact/
          cp -r /usr/local/lib ffmpeg-artifact/
          cp -r ffmpeg ffmpeg-artifact/source || true
          cp -r ffmpeg-build ffmpeg-artifact/build-scripts

          mkdir -p ffmpeg-artifact/bin
          cp -r ffmpeg-build/dist/* ffmpeg-artifact/bin/ || true

      # ─────────────────────────────────────
      # UPLOAD ARTIFACT
      # ─────────────────────────────────────
      - name: Upload FFmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static
          path: ffmpeg-artifact/

      # ─────────────────────────────────────
      # OPTIONAL DEBUG LOGS
      # ─────────────────────────────────────
      - name: Upload config.log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log
          path: ffmpeg/ffbuild/config.log
