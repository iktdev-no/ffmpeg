name: Build static FFmpeg

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  x264:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x264
        run: python ffmpeg-build/libs/build_x264.py

      - name: Package x264 install
        run: |
          mkdir -p x264-install
          cp -r /usr/local/lib/libx264.a x264-install/
          cp -r /usr/local/include/x264.h x264-install/
          cp -r /usr/local/lib/pkgconfig/x264.pc x264-install/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: x264-install
          path: x264-install/

  x265:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build x265
        run: python ffmpeg-build/libs/build_x265.py

      - name: Package x265 install
        run: |
          mkdir -p x265-install
          cp -r /usr/local/lib/libx265.a x265-install/
          cp -r /usr/local/include/x265.h x265-install/
          cp -r /usr/local/lib/pkgconfig/x265.pc x265-install/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: x265-install
          path: x265-install/

  libaom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libaom
        run: python ffmpeg-build/libs/build_libaom.py

      - name: Package libaom install
        run: |
          mkdir -p libaom-install
          cp -r /usr/local/include/aom libaom-install/
          cp -r /usr/local/lib/libaom.a libaom-install/
          cp -r /usr/local/lib/pkgconfig/aom.pc libaom-install/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: libaom-install
          path: libaom-install/

  libvpx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libvpx
        run: python ffmpeg-build/libs/build_libvpx.py

      - name: Package libvpx install
        run: |
          mkdir -p libvpx-install
          cp -r /usr/local/include/vpx libvpx-install/
          cp -r /usr/local/lib/libvpx.a libvpx-install/
          cp -r /usr/local/lib/pkgconfig/vpx.pc libvpx-install/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: libvpx-install
          path: libvpx-install/

  svtav1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build SVT-AV1
        run: python ffmpeg-build/libs/build_svtav1.py

      - name: Package SVT-AV1 install
        run: |
          mkdir -p svtav1-install
          cp -r /usr/local/include/svt-av1 svtav1-install/
          cp -r /usr/local/lib/libSvtAv1Enc.a svtav1-install/
          cp -r /usr/local/lib/pkgconfig/SvtAv1Enc.pc svtav1-install/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: svtav1-install
          path: svtav1-install/

  nvcodec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build NVENC headers
        run: python ffmpeg-build/libs/build_nvcodec.py

      - name: Package NVENC install
        run: |
          mkdir -p nvcodec-install
          cp -r /usr/local/include/ffnvcodec nvcodec-install/
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: nvcodec-install
          path: nvcodec-install/

  ffmpeg:
    runs-on: ubuntu-latest
    needs: [x264, x265, libaom, libvpx, svtav1, nvcodec]
    steps:
      - uses: actions/checkout@v4

      # --- DOWNLOAD ALL ARTIFACTS ---
      - uses: actions/download-artifact@v4
        with:
          name: x264-install
          path: /tmp/x264

      - uses: actions/download-artifact@v4
        with:
          name: x265-install
          path: /tmp/x265

      - uses: actions/download-artifact@v4
        with:
          name: libaom-install
          path: /tmp/libaom

      - uses: actions/download-artifact@v4
        with:
          name: libvpx-install
          path: /tmp/libvpx

      - uses: actions/download-artifact@v4
        with:
          name: svtav1-install
          path: /tmp/svtav1

      - uses: actions/download-artifact@v4
        with:
          name: nvcodec-install
          path: /tmp/nvcodec

      # --- INSTALL ALL LIBS INTO /usr/local ---
      - name: Install all libs
        run: |
          sudo cp -r /tmp/x264/* /usr/local/
          sudo cp -r /tmp/x265/* /usr/local/
          sudo cp -r /tmp/libaom/* /usr/local/
          sudo cp -r /tmp/libvpx/* /usr/local/
          sudo cp -r /tmp/svtav1/* /usr/local/
          sudo cp -r /tmp/nvcodec/* /usr/local/
        shell: bash

      # --- BUILD FFMPEG ---
      - run: python ffmpeg-build/generate_flags.py
      - run: python ffmpeg-build/build_ffmpeg.py

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static
          path: ffmpeg-build/dist/
